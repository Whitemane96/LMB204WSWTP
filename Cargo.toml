[package]
name = "lmb204wswtp"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-openai = "0.20" # This is a popular wrapper for OpenAI's API
dotext = "0.1.0"
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3" # For handling file streams
zip = "0.6" # For docx manipulation
regex = "1.10"
handlebars = "5.0"
dashmap = "5.5"
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4.43"